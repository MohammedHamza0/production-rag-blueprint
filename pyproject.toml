[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-blueprint"
version = "1.0.0"
description = "Generalized, enterprise-grade Production RAG Blueprint in Python"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Principal AI Architect" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.34",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.2",
    "redis>=5.0.8",
    "taskiq>=0.11.7",
    "taskiq-redis>=1.0.0",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.3.1",
    "python-docx>=1.1.2",
    "markdown-it-py>=3.0.0",
    "alembic>=1.13.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.6.4",
    "mypy>=1.11.2"
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
